<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cargar Movimiento</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c26;
    --border: #2a2a3a;
    --accent-green: #00e5a0;
    --accent-red: #ff4d6d;
    --accent-yellow: #ffd166;
    --accent-blue: #4d9fff;
    --text: #f0f0f8;
    --text-muted: #6b6b8a;
    --radius: 14px;
    --radius-sm: 10px;
    --radius-xs: 7px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; overscroll-behavior: none; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    min-height: 100vh;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 80% 0%, rgba(0,229,160,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 50% 30% at 20% 100%, rgba(255,77,109,0.05) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── HEADER ── */
  .header {
    padding: 48px 20px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .header-title {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 700;
  }
  .header-date {
    font-size: 12px;
    color: var(--text-muted);
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 5px 11px;
    border-radius: 100px;
  }

  /* ── TIPO ── */
  .tipo-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 0 20px 14px;
    flex-shrink: 0;
  }
  .tipo-btn {
    padding: 11px 10px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .tipo-btn.gasto.active { border-color: var(--accent-red); background: rgba(255,77,109,0.08); color: var(--accent-red); }
  .tipo-btn.ingreso.active { border-color: var(--accent-green); background: rgba(0,229,160,0.08); color: var(--accent-green); }

  /* ── GRUPOS PILLS ── */
  .grupos-wrap { flex-shrink: 0; padding: 0 20px 10px; }
  .grupos-scroll {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .grupos-scroll::-webkit-scrollbar { display: none; }
  .grupo-pill {
    padding: 6px 13px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .grupo-pill.active {
    border-color: var(--accent-yellow);
    background: rgba(255,209,102,0.10);
    color: var(--accent-yellow);
  }

  /* ── ÍTEMS ── */
  .items-wrap {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: none;
    padding: 0 20px;
    min-height: 0;
  }
  .items-wrap::-webkit-scrollbar { display: none; }
  .items-section-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--text-muted);
    padding: 6px 0 8px;
  }
  .items-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    padding-bottom: 12px;
  }
  .item-chip {
    padding: 11px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    text-align: center;
    line-height: 1.35;
    transition: all 0.15s;
  }
  .item-chip:active { transform: scale(0.96); }
  .item-chip.active {
    border-color: var(--accent-yellow);
    background: rgba(255,209,102,0.10);
    color: var(--accent-yellow);
  }

  /* ── PANEL INFERIOR ── */
  .bottom-panel {
    flex-shrink: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 14px 20px 28px;
  }

  /* cat seleccionada */
  .cat-selected-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    min-height: 20px;
  }
  .cat-selected-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent-yellow);
  }
  .cat-placeholder {
    font-size: 13px;
    color: var(--text-muted);
  }

  /* monto */
  .monto-box {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    margin-bottom: 11px;
    cursor: text;
    transition: border-color 0.2s;
  }
  .monto-box.focused { border-color: var(--accent-yellow); }
  .monto-prefix { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; color: var(--text-muted); }
  .monto-input {
    background: transparent;
    border: none;
    outline: none;
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    width: 100%;
  }
  .monto-input::placeholder { color: var(--text-muted); }

  /* pago */
  .pago-row { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 10px; }
  .pago-btn {
    padding: 9px;
    border-radius: var(--radius-xs);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .pago-btn.active {
    border-color: var(--accent-blue);
    background: rgba(77,159,255,0.10);
    color: var(--accent-blue);
  }

  /* panel crédito */
  .credito-panel {
    background: var(--surface2);
    border: 1px solid rgba(77,159,255,0.25);
    border-radius: var(--radius-xs);
    padding: 11px 12px;
    margin-bottom: 10px;
    display: none;
  }
  .credito-panel.visible { display: block; }
  .credito-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .credito-field label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; display: block; margin-bottom: 5px; }
  .credito-field select {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    padding: 8px 10px;
    color: var(--text);
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
  }
  .cuota-preview {
    margin-top: 9px;
    padding: 7px 10px;
    background: rgba(77,159,255,0.08);
    border-radius: var(--radius-xs);
    font-size: 11px;
    color: var(--accent-blue);
    font-weight: 500;
  }

  /* mes débito */
  .mes-debito-wrap { margin-bottom: 10px; }
  .mes-debito-wrap label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; display: block; margin-bottom: 5px; }
  .mes-debito-wrap select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    padding: 9px 12px;
    color: var(--text);
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
  }

  /* comentario */
  .comentario-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-muted);
    font-size: 12px;
    cursor: pointer;
    margin-bottom: 10px;
    width: fit-content;
    transition: color 0.15s;
    background: none;
    border: none;
    padding: 0;
  }
  .comentario-toggle:hover { color: var(--text); }
  .comentario-toggle svg { flex-shrink: 0; }
  .comentario-input-wrap { margin-bottom: 10px; display: none; }
  .comentario-input-wrap.visible { display: block; }
  .comentario-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    padding: 9px 12px;
    color: var(--text);
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }
  .comentario-input:focus { border-color: var(--accent-yellow); }
  .comentario-input::placeholder { color: var(--text-muted); }

  /* submit */
  .submit-btn {
    width: 100%;
    padding: 15px;
    border-radius: var(--radius-sm);
    border: none;
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .submit-btn.gasto { background: var(--accent-red); color: white; }
  .submit-btn.ingreso { background: var(--accent-green); color: #0a0a0f; }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .submit-btn:active:not(:disabled) { transform: scale(0.97); }

  /* spinner */
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* SUCCESS */
  .success-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .success-overlay.show { opacity: 1; pointer-events: all; }
  .success-icon { font-size: 64px; animation: bounce 0.5s ease; }
  @keyframes bounce { 0%{transform:scale(0)} 60%{transform:scale(1.2)} 100%{transform:scale(1)} }
  .success-title { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; }
  .success-sub { color: var(--text-muted); font-size: 14px; text-align: center; padding: 0 40px; line-height: 1.5; }
  .success-new-btn {
    margin-top: 12px;
    padding: 13px 30px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--accent-green);
    background: transparent;
    color: var(--accent-green);
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }

  /* TOAST */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 10px 20px;
    font-size: 13px;
    color: var(--accent-red);
    z-index: 200;
    transition: transform 0.3s;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="app">
  <!-- HEADER -->
  <div class="header">
    <div class="header-title">Nuevo movimiento</div>
    <div class="header-date" id="headerDate"></div>
  </div>

  <!-- TIPO -->
  <div class="tipo-row">
    <button class="tipo-btn gasto active" onclick="setTipo('gasto')">💸 GASTO</button>
    <button class="tipo-btn ingreso" onclick="setTipo('ingreso')">💰 INGRESO</button>
  </div>

  <!-- GRUPOS -->
  <div class="grupos-wrap">
    <div class="grupos-scroll" id="gruposScroll"></div>
  </div>

  <!-- ÍTEMS -->
  <div class="items-wrap">
    <div class="items-section-label" id="itemsLabel">Elegí una categoría</div>
    <div class="items-grid" id="itemsGrid"></div>
  </div>

  <!-- PANEL INFERIOR -->
  <div class="bottom-panel">
    <!-- cat seleccionada -->
    <div class="cat-selected-row">
      <span class="cat-placeholder" id="catDisplay">— Ninguna categoría seleccionada —</span>
    </div>

    <!-- monto -->
    <div class="monto-box" id="montoBox">
      <span class="monto-prefix">$</span>
      <input type="number" class="monto-input" id="montoInput" placeholder="0" inputmode="numeric">
    </div>

    <!-- pago (solo gasto) -->
    <div class="pago-row" id="pagoRow">
      <button class="pago-btn active" onclick="setPago('debito', this)">💳 Débito</button>
      <button class="pago-btn" onclick="setPago('credito', this)">🏦 Crédito</button>
    </div>

    <!-- panel crédito -->
    <div class="credito-panel" id="creditoPanel">
      <div class="credito-grid">
        <div class="credito-field">
          <label>Cuotas</label>
          <select id="cantCuotas" onchange="updateCuotaPreview()">
            <option value="1">1 cuota</option>
            <option value="2">2 cuotas</option>
            <option value="3" selected>3 cuotas</option>
            <option value="4">4 cuotas</option>
            <option value="6">6 cuotas</option>
            <option value="9">9 cuotas</option>
            <option value="12">12 cuotas</option>
            <option value="18">18 cuotas</option>
            <option value="24">24 cuotas</option>
          </select>
        </div>
        <div class="credito-field">
          <label>Primer mes</label>
          <select id="mesInicio" onchange="updateCuotaPreview()"></select>
        </div>
      </div>
      <div class="cuota-preview" id="cuotaPreview"></div>
    </div>

    <!-- mes débito -->
    <div class="mes-debito-wrap" id="mesDebitoWrap">
      <label>Mes</label>
      <select id="mesDebito"></select>
    </div>

    <!-- comentario colapsable -->
    <button class="comentario-toggle" id="comentarioToggle" onclick="toggleComentario()">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <line x1="3" y1="7" x2="11" y2="7"/>
        <line x1="7" y1="3" x2="7" y2="11" id="toggleLine"/>
      </svg>
      <span id="comentarioToggleText">Agregar comentario</span>
    </button>
    <div class="comentario-input-wrap" id="comentarioWrap">
      <input type="text" class="comentario-input" id="comentarioInput" placeholder="Ej: Remera Levis, cuota 2 de 3…">
    </div>

    <!-- submit -->
    <button class="submit-btn gasto" id="submitBtn" onclick="guardar()">
      <span id="submitText">Guardar gasto</span>
      <div class="spinner" id="submitSpinner"></div>
    </button>
  </div>
</div>

<!-- SUCCESS -->
<div class="success-overlay" id="successOverlay">
  <div class="success-icon" id="successIcon">✅</div>
  <div class="success-title" id="successTitle">¡Guardado!</div>
  <div class="success-sub" id="successSub"></div>
  <button class="success-new-btn" onclick="resetForm()">+ Nuevo movimiento</button>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyDFc2xlIqGJ4t0Lp9pnaAqvJtkHQwtWCScTeDzNBthJwkhlI7TDY2or9zmOg_0Uk03Tg/exec';

const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESES_FULL = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

// Grupos y categorías — nombre exacto del Sheet como value
const GRUPOS_GASTO = {
  'Hogar': [
    'Comida + Supermercado',
    'Agua Poybe (Cimes)',
    'Expensas',
    'Cosas para el hogar🏠🔧',
    'Queso y Milo🐩🐩',
    'GYM Nati',
    'Peluquería/Barbería',
    'Pileta y mundo limp 🧼',
    'Vacaciones 🏝️',
  ],
  'Servicios': [
    'GAS💨',
    'LUZ 💡 ',
    'Peajes',
    'Cable + Internet 📺emision dia 28 mes',
    'Apple (fin de mes)',
    'Spotify',
    'Osde diferencia 🏥',
    'Municipalidad',
    'ARBA (pagar MANUAL)',
  ],
  'Autos': [
    'Nafta Virtus',
    'Nafta Sandero',
    'Mecánico Auto',
    'Mecánico Virtus',
    'Seguro Auto',
    'Seguro Virtus',
    'Patente Auto',
    'Patente Virtus',
  ],
  'Mary': [
    'Mary Limpieza',
    'Mary ART + aportes 🧹',
  ],
  'Renata': [
    'Renata 👶🏻💕',
    'Dover',
  ],
  'Inversiones': [
    'Inversiones',
    'Dólares',
  ],
  'Otros': [
    ' Ocio ',
    'Regalos',
    'Farmacia',
    'Maq Pasto (nafta,aceite)',
    'Caja de psicólogos ',
    'ColPsi matrícula',
    'OTROS',
  ],
};

// Nombres para mostrar en pantalla (sin emojis raros ni espacios)
const DISPLAY_NAME = {
  'Comida + Supermercado': 'Supermercado',
  'Agua Poybe (Cimes)': 'Agua Poybe',
  'Cosas para el hogar🏠🔧': 'Hogar',
  'Queso y Milo🐩🐩': 'Queso y Milo 🐩',
  'Pileta y mundo limp 🧼': 'Pileta/Limpieza',
  'Vacaciones 🏝️': 'Vacaciones 🏝️',
  'GAS💨': 'GAS 💨',
  'LUZ 💡 ': 'LUZ 💡',
  'Cable + Internet 📺emision dia 28 mes': 'Cable + Internet',
  'Apple (fin de mes)': 'Apple',
  'Osde diferencia 🏥': 'Osde',
  'ARBA (pagar MANUAL)': 'ARBA',
  'Mary ART + aportes 🧹': 'Mary ART 🧹',
  'Renata 👶🏻💕': 'Renata 👶🏻',
  ' Ocio ': 'Ocio',
  'Maq Pasto (nafta,aceite)': 'Maq. Pasto',
  'Caja de psicólogos ': 'Caja Psicólogos',
};

const GRUPOS_INGRESO = {
  'Ingresos': ['Sueldo Juani', 'Sueldo Nati', 'Extras'],
};

let state = {
  tipo: 'gasto',
  grupo: null,
  cat: null,
  pago: 'debito',
  monto: 0,
  mesDebito: '',
  mesInicio: '',
  cuotas: 3,
  comentario: '',
  comentarioOpen: false,
};

function getGrupos() {
  return state.tipo === 'gasto' ? GRUPOS_GASTO : GRUPOS_INGRESO;
}

function init() {
  const now = new Date();
  document.getElementById('headerDate').textContent =
    now.toLocaleDateString('es-AR', { day: 'numeric', month: 'short', year: 'numeric' });

  // Poblar selectores de mes — dinámico, desde ene 25 hasta 4 años adelante
  const mesesOptions = [];
  const anioInicio = 2025;
  const anioFin = now.getFullYear() + 4;
  for (let y = anioInicio; y <= anioFin; y++) {
    for (let m = 0; m < 12; m++) {
      mesesOptions.push({
        value: MESES[m] + ' ' + String(y).slice(-2),
        label: MESES_FULL[m] + ' ' + y,
      });
    }
  }

  const selDebito = document.getElementById('mesDebito');
  const selInicio = document.getElementById('mesInicio');
  mesesOptions.forEach(opt => {
    selDebito.add(new Option(opt.label, opt.value));
    selInicio.add(new Option(opt.label, opt.value));
  });

  const defaultMes = MESES[now.getMonth()] + ' ' + String(now.getFullYear()).slice(-2);
  selDebito.value = defaultMes;
  selInicio.value = defaultMes;
  state.mesDebito = defaultMes;
  state.mesInicio = defaultMes;

  // monto box focus
  document.getElementById('montoInput').addEventListener('focus', () =>
    document.getElementById('montoBox').classList.add('focused'));
  document.getElementById('montoInput').addEventListener('blur', () =>
    document.getElementById('montoBox').classList.remove('focused'));

  renderGrupos();
  updateCuotaPreview();
}

function renderGrupos() {
  const grupos = getGrupos();
  const scroll = document.getElementById('gruposScroll');
  scroll.innerHTML = '';
  Object.keys(grupos).forEach(g => {
    const pill = document.createElement('div');
    pill.className = 'grupo-pill' + (state.grupo === g ? ' active' : '');
    pill.textContent = g;
    pill.onclick = () => selectGrupo(g);
    scroll.appendChild(pill);
  });
  renderItems();
}

function selectGrupo(g) {
  state.grupo = g;
  state.cat = null;
  updateCatDisplay();
  renderGrupos();
}

function renderItems() {
  const grupos = getGrupos();
  const grid = document.getElementById('itemsGrid');
  const label = document.getElementById('itemsLabel');
  grid.innerHTML = '';

  if (!state.grupo || !grupos[state.grupo]) {
    label.textContent = 'Elegí un grupo arriba';
    return;
  }

  label.textContent = state.grupo;
  grupos[state.grupo].forEach(cat => {
    const chip = document.createElement('div');
    chip.className = 'item-chip' + (state.cat === cat ? ' active' : '');
    chip.textContent = DISPLAY_NAME[cat] || cat;
    chip.onclick = () => selectCat(cat);
    grid.appendChild(chip);
  });
}

function selectCat(cat) {
  state.cat = cat;
  updateCatDisplay();
  renderItems();
}

function updateCatDisplay() {
  const el = document.getElementById('catDisplay');
  if (state.cat) {
    el.className = 'cat-selected-name';
    el.textContent = DISPLAY_NAME[state.cat] || state.cat;
  } else {
    el.className = 'cat-placeholder';
    el.textContent = '— Ninguna categoría seleccionada —';
  }
}

function setTipo(t) {
  state.tipo = t;
  state.cat = null;
  state.grupo = null;

  document.querySelectorAll('.tipo-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.tipo-btn.' + t).classList.add('active');
  document.getElementById('submitBtn').className = 'submit-btn ' + t;
  document.getElementById('submitText').textContent = t === 'gasto' ? 'Guardar gasto' : 'Guardar ingreso';

  // ocultar pago si es ingreso
  document.getElementById('pagoRow').style.display = t === 'ingreso' ? 'none' : '';
  document.getElementById('creditoPanel').classList.remove('visible');
  document.getElementById('mesDebitoWrap').style.display = '';

  updateCatDisplay();
  renderGrupos();
}

function setPago(p, btn) {
  state.pago = p;
  document.querySelectorAll('.pago-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  if (p === 'credito') {
    document.getElementById('creditoPanel').classList.add('visible');
    document.getElementById('mesDebitoWrap').style.display = 'none';
  } else {
    document.getElementById('creditoPanel').classList.remove('visible');
    document.getElementById('mesDebitoWrap').style.display = '';
  }
  updateCuotaPreview();
}

function updateCuotaPreview() {
  state.cuotas = parseInt(document.getElementById('cantCuotas').value) || 3;
  state.mesInicio = document.getElementById('mesInicio').value;
  state.mesDebito = document.getElementById('mesDebito').value;
  state.monto = parseFloat(document.getElementById('montoInput').value) || 0;

  const preview = document.getElementById('cuotaPreview');
  if (state.monto > 0 && state.cuotas > 0) {
    const porCuota = Math.round(state.monto / state.cuotas);
    const [mes, anio] = state.mesInicio.split(' ');
    const mesIdx = MESES.indexOf(mes);
    const labels = [];
    for (let i = 0; i < state.cuotas; i++) {
      const idx = (mesIdx + i) % 12;
      const y = parseInt('20' + anio) + Math.floor((mesIdx + i) / 12);
      labels.push(MESES_FULL[idx].slice(0, 3) + ' ' + String(y).slice(-2));
    }
    preview.textContent = state.cuotas + ' cuotas de $' + porCuota.toLocaleString('es-AR') + ' — ' + labels.join(', ');
  } else {
    preview.textContent = 'Ingresá el monto para ver el detalle';
  }
}

// escuchar cambios en monto para actualizar preview
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('montoInput').addEventListener('input', updateCuotaPreview);
});

function toggleComentario() {
  state.comentarioOpen = !state.comentarioOpen;
  const wrap = document.getElementById('comentarioWrap');
  const line = document.getElementById('toggleLine');
  const text = document.getElementById('comentarioToggleText');
  if (state.comentarioOpen) {
    wrap.classList.add('visible');
    line.style.display = 'none';
    text.textContent = 'Quitar comentario';
    document.getElementById('comentarioInput').focus();
  } else {
    wrap.classList.remove('visible');
    line.style.display = '';
    text.textContent = 'Agregar comentario';
    document.getElementById('comentarioInput').value = '';
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

async function guardar() {
  if (!state.cat) { showToast('⚠️ Elegí una categoría'); return; }
  state.monto = parseFloat(document.getElementById('montoInput').value) || 0;
  if (!state.monto || state.monto <= 0) { showToast('⚠️ Ingresá un monto'); return; }
  state.comentario = document.getElementById('comentarioInput').value.trim();
  state.mesDebito = document.getElementById('mesDebito').value;
  state.mesInicio = document.getElementById('mesInicio').value;
  state.cuotas = parseInt(document.getElementById('cantCuotas').value) || 1;

  const btn = document.getElementById('submitBtn');
  const text = document.getElementById('submitText');
  const spinner = document.getElementById('submitSpinner');
  btn.disabled = true;
  text.style.display = 'none';
  spinner.style.display = 'block';

  const esCredito = state.tipo === 'gasto' && state.pago === 'credito';

  const payload = {
    action: 'cargarMovimiento',
    tipo: state.tipo,
    categoria: state.cat,
    monto: state.monto,
    comentario: state.comentario,
    pago: state.tipo === 'ingreso' ? 'debito' : state.pago,
    mes: esCredito ? null : state.mesDebito,
    mesInicio: esCredito ? state.mesInicio : null,
    cuotas: esCredito ? state.cuotas : 1,
  };

  try {
    let rawData = encodeURIComponent(JSON.stringify(payload));
    const res = await fetch(API_URL + '?data=' + rawData);
    const data = await res.json();

    if (data.success) {
      document.getElementById('successIcon').textContent = state.tipo === 'gasto' ? '✅' : '🎉';
      document.getElementById('successTitle').textContent = state.tipo === 'gasto' ? '¡Gasto guardado!' : '¡Ingreso guardado!';
      let sub = (DISPLAY_NAME[state.cat] || state.cat);
      if (state.comentario) sub += ' — ' + state.comentario;
      if (esCredito && state.cuotas > 1) {
        sub += '\n' + state.cuotas + ' cuotas de $' + Math.round(state.monto / state.cuotas).toLocaleString('es-AR');
      }
      sub += '\n$' + Math.round(state.monto).toLocaleString('es-AR');
      document.getElementById('successSub').textContent = sub;
      document.getElementById('successOverlay').classList.add('show');
    } else {
      throw new Error(data.error || 'Error desconocido');
    }
  } catch(e) {
    showToast('❌ Error: ' + e.message);
    btn.disabled = false;
    text.style.display = 'block';
    spinner.style.display = 'none';
  }
}

function resetForm() {
  document.getElementById('successOverlay').classList.remove('show');
  document.getElementById('montoInput').value = '';
  document.getElementById('comentarioInput').value = '';
  state.cat = null;
  state.grupo = null;
  state.monto = 0;
  state.comentario = '';
  state.comentarioOpen = false;
  document.getElementById('comentarioWrap').classList.remove('visible');
  document.getElementById('toggleLine').style.display = '';
  document.getElementById('comentarioToggleText').textContent = 'Agregar comentario';

  const btn = document.getElementById('submitBtn');
  btn.disabled = false;
  document.getElementById('submitText').style.display = 'block';
  document.getElementById('submitSpinner').style.display = 'none';

  updateCatDisplay();
  renderGrupos();
}

init();
</script>
</body>
</html>
