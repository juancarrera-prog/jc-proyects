<!DOCTYPE html>
<html lang="es"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>CASA</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#26362f;background:#f7f6f1}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:600px;margin:auto;padding:30px 20px 90px}.eyebrow{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#819186;font-weight:700}.header{display:flex;justify-content:space-between;align-items:center}.logo{font-size:44px;letter-spacing:-3px;font-weight:850;margin:4px 0}.sub{color:#819186;font-size:14px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#eeeee8;padding:5px;border-radius:18px;margin:30px 0 24px}.tab{border:0;background:transparent;border-radius:14px;padding:13px 6px;color:#68786d;font-weight:700}.tab.active{background:#fff;color:#294c3b;box-shadow:0 2px 8px #1b32200c}.card{background:white;border:1px solid #e8eae2;border-radius:24px;padding:20px;box-shadow:0 5px 28px #26362f08}.section-title{font-size:24px;letter-spacing:-.7px;margin:0 0 6px}.hint{font-size:13px;color:#839085;margin:0 0 22px}.form{display:flex;gap:8px;margin-bottom:20px}.field{min-width:0;flex:1;border:1px solid #dfe5dc;border-radius:13px;padding:14px 13px;background:#fff;outline-color:#668c72}.add{background:#315d47;border:0;color:#fff;border-radius:13px;padding:0 18px;font-weight:750}.item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #f0f0ed}.item:last-child{border-bottom:0}.check{width:23px;height:23px;border:2px solid #b9c6bc;border-radius:9px;background:white;flex-shrink:0}.check.done{background:#315d47;border-color:#315d47;color:white}.itemname{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}.itemname.done{text-decoration:line-through;color:#a0aba2}.minor{font-size:12px;color:#96a199;margin-top:3px}.iconbtn{border:0;background:transparent;color:#9ba79e;padding:6px 8px;font-size:18px}.pill{border-radius:99px;padding:5px 9px;font-size:11px;font-weight:750}.red{background:#fbe5e2;color:#aa453d}.yellow{background:#fff0cb;color:#a17725}.green{background:#e4f2e6;color:#477c53}.tools{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:8px}.textbtn{border:0;background:none;color:#718476;font-size:12px;text-decoration:underline}.empty{text-align:center;padding:38px 12px;color:#a0ada3}.empty b{display:block;color:#516558;margin-bottom:7px}.extra{display:flex;gap:7px;margin:0 0 18px}.extra input,.extra select{width:50%;padding:10px;border:1px solid #e0e5df;border-radius:12px;background:#fff;color:#566c5c}.status{font-size:12px;color:#7d8e82;min-height:22px;margin:12px 0}.lock{max-width:430px;margin:16vh auto;padding:28px;background:white;border-radius:24px;border:1px solid #e6e9e2}.lock h1{font-size:42px;letter-spacing:-2px;margin:0 0 8px}.lock p{color:#819186}.lock input{width:100%;margin:12px 0}.lock button{width:100%;height:48px}.hide{display:none!important}.priority{display:flex;gap:6px}.priority button{border:1px solid #e5e9e2;background:white;padding:8px 12px;border-radius:12px}.priority button.sel{border-color:#315d47;box-shadow:inset 0 0 0 1px #315d47}.footer{text-align:center;font-size:11px;color:#b1bcb2;margin-top:28px}@media(max-width:380px){.app{padding:20px 12px}.card{padding:15px}.logo{font-size:38px}}
</style></head><body>
<div id="login" class="lock"><div class="eyebrow">Nuestro espacio</div><h1>casa<span style="color:#7aa18a">.</span></h1><p>Las cosas de todos los días, en un solo lugar.</p><input class="field" id="pin" type="password" inputmode="numeric" placeholder="Clave familiar" aria-label="Clave familiar" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="textbtn" id="keyboardtoggle" type="button" aria-controls="pin" onclick="togglePinKeyboard()">Usar teclado completo (letras y símbolos)</button><button class="add" onclick="login()">Entrar a CASA</button><div class="status" id="loginstatus"></div></div>
<main id="main" class="app hide"><div class="header"><div><div class="eyebrow">Nuestro espacio</div><div class="logo">casa<span style="color:#7aa18a">.</span></div><div class="sub">Todo lo que hace hogar.</div></div><button class="iconbtn" onclick="refresh()" title="Actualizar">↻</button></div>
<nav class="tabs"><button class="tab active" data-tab="compras" onclick="tab('compras')">🛒 Compras</button><button class="tab" data-tab="pendientes" onclick="tab('pendientes')">📅 Pendientes</button><button class="tab" data-tab="casa" onclick="tab('casa')">🏡 Casa</button></nav>
<section class="card"><h2 id="heading" class="section-title">Lista de compras</h2><p id="description" class="hint">Todo lo que necesitamos comprar.</p><form class="form" onsubmit="add(event)"><input id="entry" class="field" maxlength="180" placeholder="Agregar producto..." required><button class="add" type="submit">+ Agregar</button></form><div id="extras" class="extra"></div><div id="items"></div><div class="tools"><span class="sub" id="count"></span><button class="textbtn" id="clear" onclick="clearList()">Vaciar lista</button></div></section><div class="status" id="status"></div><div class="footer">HECHO PARA NUESTRA FAMILIA ♡</div></main>
<script>
let pin='',active='compras',data={compras:[],pendientes:[],casa:[]},busy=false;
const $=id=>document.getElementById(id);
function call(name,...args){return new Promise((ok,fail)=>google.script.run.withSuccessHandler(ok).withFailureHandler(fail)[name](...args))}
function err(e){return e&&e.message?e.message:String(e)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function togglePinKeyboard(){
 const input=$('pin'),numeric=input.inputMode!=='numeric';
 input.blur();
 input.inputMode=numeric?'numeric':'text';
 $('keyboardtoggle').textContent=numeric?'Usar teclado completo (letras y símbolos)':'Usar teclado numérico';
 input.focus();
}
async function login(){pin=$('pin').value;if(!pin)return;try{data=await call('getCasa',pin);$('login').classList.add('hide');$('main').classList.remove('hide');render();}catch(e){$('loginstatus').textContent=err(e)}}
function tab(t){active=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
function render(){
 const titles={compras:['Lista de compras','Todo lo que necesitamos comprar.'],pendientes:['Pendientes familiares','Fechas, recordatorios y pequeñas misiones.'],casa:['Nuestra casa','Lo urgente, lo importante y lo que puede esperar.']};
 $('heading').textContent=titles[active][0];$('description').textContent=titles[active][1];$('entry').placeholder=active==='compras'?'Agregar producto...':'Agregar tarea...';
 $('extras').innerHTML=active==='pendientes'?'<input id="date" type="date" aria-label="Fecha">':active==='casa'?'<select id="priority" aria-label="Prioridad"><option value="rojo">🔴 Urgente</option><option value="amarillo" selected>🟡 Importante</option><option value="verde">🟢 Puede esperar</option></select>':'';
 const arr=data[active]||[];let html='';
 const sorted=[...arr].sort((a,b)=>String(a.completado==='true').localeCompare(String(b.completado==='true')));
 if(active==='casa')sorted.sort((a,b)=>({rojo:0,amarillo:1,verde:2}[a.prioridad]??1)-({rojo:0,amarillo:1,verde:2}[b.prioridad]??1));
 for(const item of sorted){const done=item.completado==='true',name=active==='compras'?item.producto:item.tarea;const meta=active==='compras'?(item.cantidad||'1')+' unidad(es)':active==='pendientes'?(item.fecha||'Sin fecha'):({rojo:'Urgente',amarillo:'Importante',verde:'Puede esperar'}[item.prioridad]||'Importante');const color=active==='casa'?'<span class="pill '+(item.prioridad==='rojo'?'red':item.prioridad==='verde'?'green':'yellow')+'">'+esc(meta)+'</span>':'';html+='<div class="item"><button class="check '+(done?'done':'')+'" onclick="toggle(\''+esc(item.id)+'\','+(!done)+')" aria-label="Completar">'+(done?'✓':'')+'</button><div class="itemname '+(done?'done':'')+'">'+esc(name)+'<div class="minor">'+(active==='casa'?'':esc(meta))+'</div></div>'+color+'<button class="iconbtn" onclick="removeItem(\''+esc(item.id)+'\')" aria-label="Eliminar">×</button></div>'}
 $('items').innerHTML=html||'<div class="empty"><b>¡Todo al día! ✨</b>Agregá algo para empezar.</div>';
 $('count').textContent=arr.filter(x=>x.completado!=='true').length+' pendientes';$('clear').classList.toggle('hide',active!=='compras'||!arr.length)
}
async function mutation(action,payload){if(busy)return;busy=true;$('status').textContent='Guardando...';try{data=await call('changeCasa',pin,active,action,payload);render();$('status').textContent='✓ Sincronizado';}catch(e){$('status').textContent='Error: '+err(e)}finally{busy=false}}
function add(e){e.preventDefault();const input=$('entry');const val=input.value.trim();if(!val)return;const p=active==='compras'?{producto:val}: {tarea:val};if(active==='pendientes')p.fecha=$('date').value;if(active==='casa')p.prioridad=$('priority').value;input.value='';mutation('add',p)}
function toggle(id,done){mutation('update',{id,completado:String(done)})}
function removeItem(id){if(confirm('¿Eliminar este elemento?'))mutation('delete',{id})}
function clearList(){if(confirm('¿Vaciar toda la lista de compras?'))mutation('clearAll',{})}
async function refresh(){if(!pin)return;try{data=await call('getCasa',pin);render();$('status').textContent='✓ Actualizado'}catch(e){$('status').textContent=err(e)}}
setInterval(()=>{if(pin&&!busy&&!document.hidden)refresh()},20000);
</script></body></html>
